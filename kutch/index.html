<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kutch Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  :root { --page: #f4f1ec; --ink: #2a2420; --dim: #7a7166; --line: rgba(42,36,32,.28); --accent: #bf1e3a; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); }
  body { overflow: hidden; font: 13px/1.4 system-ui, -apple-system, sans-serif; --padx: clamp(14px, 6vw, 110px); }
  .stage { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 18px var(--padx) 0; box-sizing: border-box; gap: 10px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font: italic 500 22px/1.1 "Fraunces", "Iowan Old Style", Georgia, serif; }
  header p { margin: 0; color: var(--dim); font-size: 12px; }
  header .hint { margin-left: auto; letter-spacing: .04em; white-space: nowrap; }
  .wrap { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; touch-action: none; border-radius: 4px; box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 10px 30px -18px rgba(60,40,30,.5); }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 0 26px; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .label b { color: var(--ink); font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .rack { display: flex; gap: 6px; flex-wrap: wrap; }
  .skein { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); cursor: pointer; padding: 0; background: var(--c);
      box-shadow: inset 0 -4px 6px rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.25); transition: transform .12s; }
  .skein:hover { transform: scale(1.12); }
  .skein:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.b { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px;
      font: inherit; font-size: 12px; cursor: pointer; letter-spacing: .02em; }
  button.b:hover { border-color: rgba(42,36,32,.7); }
  button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.b.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--accent); color: #fff;
      padding: 8px 14px; border-radius: 6px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) { header .hint { display: none; } .row { padding: 10px 0 16px; gap: 10px; } }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Kutch work</h1>
    <p>The interlaced stitch of Kachchh, Gujarat, worked here one stitch at a time.</p>
    <p class="hint">hover to ruffle the stitches · click to pluck</p>
  </header>
  <div class="wrap"><canvas id="c"></canvas></div>
  <div class="row">
    <span class="label"><b id="count"></b> stitches · <span id="selname">click a motif, then a skein</span></span>
    <div class="rack" id="rack" aria-label="Thread skeins"></div>
    <span class="spacer"></span>
    <button class="b" id="again">stitch again</button>
    <button class="b primary" id="share">Share link</button>
  </div>
</div>
<div class="toast" id="toast">Link copied</div>

<script>
(() => {
  // ---------- the design lives in a 700 x 700 space centred on 0,0 ----------
  const HALF = 350;
  const THREADS = { red: '#cf1f3c', orange: '#f08a1e', yellow: '#efd25c', green: '#1b7f4c', lime: '#86c94e', blue: '#2a2ea6',
                    sky: '#4e95d8', pink: '#e68fb3', purple: '#7a4ea8', black: '#2a2a2a', teal: '#1f9a8a', white: '#f6f1e6' };

  const motifs = [], stitches = [];
  const motif = (type, cx, cy, r, color, name) => { motifs.push({ type, cx, cy, r, color, name }); return motifs.length - 1; };
  const S = (m, x1, y1, x2, y2, w = 3.2) => stitches.push({ m, x1, y1, x2, y2, w, dx: 0, dy: 0, vx: 0, vy: 0 });
  const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

  // ---- stitch types ----
  function spokeCircle(m, cx, cy, r) {                       // buttonhole wheel: spokes from a small ring to the rim
    const n = Math.max(18, Math.round(2 * Math.PI * r / 5.2));
    for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a); S(m, cx + c * r * .24, cy + s * r * .24, cx + c * r * .96, cy + s * r * .96, 3); }
    const n2 = 10;
    for (let i = 0; i < n2; i++) { const a = i / n2 * 2 * Math.PI, b = a + 2 * Math.PI / n2; S(m, cx + Math.cos(a) * r * .2, cy + Math.sin(a) * r * .2, cx + Math.cos(b) * r * .2, cy + Math.sin(b) * r * .2, 2.4); }
  }
  function disk(m, cx, cy, r, ang) {                         // satin stitch: parallel strands across the circle
    for (let y = -r + 1.8; y < r; y += 3.4) {
      const h = Math.sqrt(Math.max(0, r * r - y * y)); const [x1, y1] = rot(-h, y, ang), [x2, y2] = rot(h, y, ang);
      S(m, cx + x1, cy + y1, cx + x2, cy + y2, 3.4);
    }
  }
  function lattice(m, cx, cy, size, ang) {                   // the open square: cross stitches with four windows
    const cs = size / 5, holes = new Set(['1,1', '1,3', '3,1', '3,3']);
    for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
      if (holes.has(i + ',' + j)) continue;
      const x = (i - 2) * cs, y = (j - 2) * cs, d = cs * .46;
      for (const [ax, ay, bx, by] of [[-d, -d, d, d], [-d, d, d, -d]]) { const [x1, y1] = rot(x + ax, y + ay, ang), [x2, y2] = rot(x + bx, y + by, ang); S(m, cx + x1, cy + y1, cx + x2, cy + y2, 2.8); }
    }
  }
  function chainRing(m, cx, cy, r) {                         // two tight rings of short chain stitches
    for (const rr of [r, r + 6]) { const n = Math.round(2 * Math.PI * rr / 5.2), d = 2.9 / rr;
      for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI; S(m, cx + Math.cos(a - d) * rr, cy + Math.sin(a - d) * rr, cx + Math.cos(a + d) * rr, cy + Math.sin(a + d) * rr, 3); } }
  }
  function cross(m, cx, cy, R, ang) {                        // the Kutch unit: a four-armed cross, each arm filled with satin stitches
    for (let k = 0; k < 4; k++) {
      const t = k * Math.PI / 2 + ang, ux = Math.cos(t), uy = Math.sin(t), px = -uy, py = ux;
      for (let d = R * .3; d < R; d += 3.1) {
        const f = d / R, half = R * (f < .6 ? .19 : .19 - (f - .6) * .22);   // slim arm that steps in towards the tip
        S(m, cx + ux * d + px * half, cy + uy * d + py * half, cx + ux * d - px * half, cy + uy * d - py * half, 3.3);
      }
    }
    const h = R * .22, sq = [[-h, -h], [h, -h], [h, h], [-h, h]];                                 // an open square heart
    for (let k = 0; k < 4; k++) { const [ax, ay] = rot(...sq[k], ang), [bx, by] = rot(...sq[(k + 1) % 4], ang); for (let t = 0; t < 1; t += .5) S(m, cx + ax + (bx - ax) * t, cy + ay + (by - ay) * t, cx + ax + (bx - ax) * (t + .5), cy + ay + (by - ay) * (t + .5), 3.1); }
  }

  // ---- the medallion, generated in stitching order: centre first, border last ----
  function build() {
    motifs.length = 0; stitches.length = 0;
    let m = motif('disk', 0, 0, 18, THREADS.black, 'centre'); disk(m, 0, 0, 16, 0.5);
    m = motif('wheel', 0, 0, 46, THREADS.yellow, 'centre wheel');
    for (let i = 0, n = 64; i < n; i++) { const a = i / n * 2 * Math.PI; S(m, Math.cos(a) * 19, Math.sin(a) * 19, Math.cos(a) * 43, Math.sin(a) * 43, 3); }
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2, x = Math.cos(a) * 95, y = Math.sin(a) * 95; m = motif('wheel', x, y, 28, THREADS.green, 'inner wheel ' + (k + 1)); spokeCircle(m, x, y, 26); }
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4, x = Math.cos(a) * 95, y = Math.sin(a) * 95; m = motif('lattice', x, y, 34, THREADS.pink, 'inner square ' + (k + 1)); lattice(m, x, y, 52, Math.PI / 4); }
    const border = motif('border', 0, 0, 0, THREADS.red, 'red border');
    chainRing(border, 0, 0, 132);
    const ring = [['lattice', THREADS.orange], ['disk', THREADS.blue], ['lattice', THREADS.sky], ['disk', THREADS.black], ['lattice', THREADS.orange], ['wheel', THREADS.lime], ['lattice', THREADS.purple],
                  ['lattice', THREADS.orange], ['disk', THREADS.black], ['lattice', THREADS.sky], ['disk', THREADS.blue], ['lattice', THREADS.orange], ['wheel', THREADS.lime], ['lattice', THREADS.purple]];
    ring.forEach(([type, col], i) => {
      const a = i / ring.length * 2 * Math.PI - Math.PI / 2, x = Math.cos(a) * 192, y = Math.sin(a) * 192;
      const mm = motif(type, x, y, 30, col, 'outer ' + type + ' ' + (i + 1));
      if (type === 'lattice') lattice(mm, x, y, 50, a + Math.PI / 4); else if (type === 'disk') disk(mm, x, y, 24, a); else spokeCircle(mm, x, y, 25);
    });
    // two staggered rings of crosses whose arm tips meet, so they read as one interlocked lattice
    const n1 = 18, R1 = 232, A = Math.PI * R1 / n1;                       // arm length: tangential tips just touch
    for (let i = 0; i < n1; i++) { const a = i / n1 * 2 * Math.PI; cross(border, Math.cos(a) * R1, Math.sin(a) * R1, A, a); }
    const R2 = R1 + 2 * A * .92, n2 = 18;
    for (let i = 0; i < n2; i++) { const a = (i + .5) / n2 * 2 * Math.PI; cross(border, Math.cos(a) * R2, Math.sin(a) * R2, A, a); }
    document.getElementById('count').textContent = stitches.length;
  }
  build();

  // ---------- colours in the url ----------
  const encode = () => motifs.map(mo => mo.color.slice(1)).join(',');
  const fromHash = () => { const mt = /[#&]c=([0-9a-f,]+)/i.exec(location.hash); if (!mt) return; const cs = mt[1].split(','); if (cs.length !== motifs.length) return; motifs.forEach((mo, i) => { if (/^[0-9a-f]{6}$/i.test(cs[i])) mo.color = '#' + cs[i].toLowerCase(); }); };
  fromHash();

  // ---------- canvas ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), wrap = cv.parentElement;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let L = 10, scale = 1, grain;
  function layout() {
    L = Math.max(10, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight)));
    cv.style.width = cv.style.height = L + 'px'; cv.width = cv.height = Math.round(L * dpr); scale = L / (HALF * 2);
    grain = document.createElement('canvas'); grain.width = grain.height = 256;                 // a scrap of plain-weave linen
    const g = grain.getContext('2d'), img = g.createImageData(256, 256), p = img.data;
    let seed = 7; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) { const i = (y * 256 + x) * 4; const v = 236 + ((x % 4 < 2) !== (y % 4 < 2) ? 6 : -4) + (rnd() - .5) * 12; p[i] = v + 4; p[i + 1] = v + 1; p[i + 2] = v - 5; p[i + 3] = 255; }
    g.putImageData(img, 0, 0);
  }
  new ResizeObserver(layout).observe(wrap); layout();

  // ---------- physics ----------
  const K = 60, DAMP = 0.985, R = 42, PUSH = 420, DRAG = 0.5, DMAX = 7;
  const mouse = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, on: false };
  const toDesign = e => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width - .5) * HALF * 2, ((e.clientY - r.top) / r.height - .5) * HALF * 2]; };
  cv.addEventListener('pointermove', e => { const [x, y] = toDesign(e); if (!mouse.on) { mouse.px = x; mouse.py = y; } mouse.x = x; mouse.y = y; mouse.on = true; });
  cv.addEventListener('pointerleave', () => { mouse.on = false; });
  cv.addEventListener('pointerdown', e => {
    const [x, y] = toDesign(e);
    for (const st of stitches) { const cx = (st.x1 + st.x2) / 2 + st.dx, cy = (st.y1 + st.y2) / 2 + st.dy, ddx = cx - x, ddy = cy - y, r = Math.hypot(ddx, ddy); if (r < 60) { const f = 520 * (1 - r / 60) / (r + 1); st.vx += ddx * f; st.vy += ddy * f; } }
    select(x, y);
  });
  function step(dt) {
    const on = mouse.on, R2 = R * R;
    for (const st of stitches) {
      let fx = -K * st.dx, fy = -K * st.dy;
      if (on) { const cx = (st.x1 + st.x2) / 2 + st.dx, cy = (st.y1 + st.y2) / 2 + st.dy, ddx = cx - mouse.x, ddy = cy - mouse.y, r2 = ddx * ddx + ddy * ddy;
        if (r2 < R2) { const r = Math.sqrt(r2) + 1e-3, w = 1 - r / R; fx += w * w * (ddx / r * PUSH + mouse.vx * DRAG); fy += w * w * (ddy / r * PUSH + mouse.vy * DRAG); } }
      st.vx = (st.vx + fx * dt) * DAMP; st.vy = (st.vy + fy * dt) * DAMP;
      st.dx += st.vx * dt; st.dy += st.vy * dt;
      const d = Math.hypot(st.dx, st.dy); if (d > DMAX) { st.dx *= DMAX / d; st.dy *= DMAX / d; }
    }
  }

  // ---------- stitching animation ----------
  const DUR = 9000; let t0 = performance.now();
  const easeOut = p => 1 - Math.pow(1 - p, 2.2);
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = c => Math.max(0, Math.min(255, Math.round(c * (1 + k)))); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; };

  let selected = -1;
  function draw() {
    const p = Math.min(1, (performance.now() - t0) / DUR), visible = Math.floor(easeOut(p) * stitches.length);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, L, L);
    ctx.translate(L / 2, L / 2); ctx.scale(scale, scale);
    ctx.lineCap = 'round';
    // highlight ring around the selected motif
    if (selected >= 0) { const mo = motifs[selected]; ctx.strokeStyle = 'rgba(191,30,58,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.beginPath();
      if (mo.type === 'border') { ctx.arc(0, 0, 126, 0, Math.PI * 2); ctx.moveTo(344, 0); ctx.arc(0, 0, 344, 0, Math.PI * 2); } else ctx.arc(mo.cx, mo.cy, mo.r + 6, 0, Math.PI * 2);
      ctx.stroke(); ctx.setLineDash([]); }
    // stitches, batched by motif: shadow, floss, sheen
    let i = 0;
    while (i < visible) {
      const m = stitches[i].m; let j = i; while (j < visible && stitches[j].m === m) j++;
      const color = motifs[m].color, w = stitches[i].w;
      const path = (ox, oy) => { ctx.beginPath(); for (let k = i; k < j; k++) { const s = stitches[k]; ctx.moveTo(s.x1 + s.dx + ox, s.y1 + s.dy + oy); ctx.lineTo(s.x2 + s.dx + ox, s.y2 + s.dy + oy); } };
      ctx.lineWidth = w + .4; ctx.strokeStyle = 'rgba(60,40,30,.28)'; path(.9, 1.1); ctx.stroke();
      ctx.lineWidth = w; ctx.strokeStyle = color; path(0, 0); ctx.stroke();
      ctx.lineWidth = w * .34; ctx.strokeStyle = shade(color, .45); ctx.globalAlpha = .55; path(-.45, -.55); ctx.stroke(); ctx.globalAlpha = 1;
      i = j;
    }
    // the needle, resting at the last stitch while the work is in progress
    if (visible > 0 && p < 1) {
      const s = stitches[visible - 1], ex = s.x2 + s.dx, ey = s.y2 + s.dy, nx = ex + 6, ny = ey - 4;
      ctx.strokeStyle = motifs[s.m].color; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.quadraticCurveTo(ex + 14, ey - 30, nx + 24, ny - 22); ctx.stroke();   // the floss tail
      const g = ctx.createLinearGradient(nx, ny, nx + 30, ny - 24); g.addColorStop(0, '#e9e9ea'); g.addColorStop(.5, '#a9abb0'); g.addColorStop(1, '#f2f2f3');
      ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(nx + 30, ny - 24); ctx.stroke();
      ctx.lineWidth = 1; ctx.strokeStyle = '#6b6d72'; ctx.beginPath(); ctx.ellipse(nx + 25, ny - 20, 1.2, 2.4, -Math.PI / 4 - .3, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function frame() {
    if (mouse.on) { mouse.vx = Math.max(-1200, Math.min(1200, (mouse.x - mouse.px) * 60)); mouse.vy = Math.max(-1200, Math.min(1200, (mouse.y - mouse.py) * 60)); mouse.px = mouse.x; mouse.py = mouse.y; }
    else mouse.vx = mouse.vy = 0;
    step(1 / 120); step(1 / 120); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- picking motifs and re-threading them ----------
  const $ = id => document.getElementById(id);
  function select(x, y) {
    let best = -1, bd = Infinity;
    motifs.forEach((mo, i) => { if (mo.type === 'border') return; const d = Math.hypot(x - mo.cx, y - mo.cy); if (d < mo.r + 6 && d < bd) { bd = d; best = i; } });
    if (best < 0) { const d = Math.hypot(x, y); if (d > 122 && d < 350) best = motifs.findIndex(mo => mo.type === 'border'); }
    selected = best;
    $('selname').textContent = best >= 0 ? motifs[best].name + ' selected · pick a skein' : 'click a motif, then a skein';
  }
  for (const [name, c] of Object.entries(THREADS)) {
    const b = document.createElement('button'); b.className = 'skein'; b.style.setProperty('--c', c); b.title = name; b.setAttribute('aria-label', 'thread ' + name);
    b.addEventListener('click', () => { if (selected < 0) { $('selname').textContent = 'click a motif first'; return; } motifs[selected].color = c; history.replaceState(null, '', '#c=' + encode()); });
    $('rack').appendChild(b);
  }
  $('again').addEventListener('click', () => { t0 = performance.now(); for (const s of stitches) { s.dx = s.dy = s.vx = s.vy = 0; } });
  $('share').addEventListener('click', async () => {
    const url = location.origin + location.pathname + '#c=' + encode(); history.replaceState(null, '', '#c=' + encode());
    const toast = $('toast');
    try { await navigator.clipboard.writeText(url); toast.textContent = 'Link copied'; } catch { toast.textContent = 'Copy the address bar to share'; }
    toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1600);
  });
})();
</script>
</body>
</html>
