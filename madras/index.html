<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madras Weave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  :root { --panel: #f4f1ec; --ink: #2a2420; --dim: #7a7166; --line: rgba(42,36,32,.28); --accent: #6e3b2c; --frame: #6e3b2c; --frame-dark: #4f281d;
          --paper: #f3ead8; --paper-ink: #3b2a1a; --serif: "Fraunces", "Iowan Old Style", Georgia, serif; }
  html, body { margin: 0; height: 100%; background: var(--panel); color: var(--ink); }
  body { overflow: hidden; font: 13px/1.4 system-ui, -apple-system, sans-serif; --padx: clamp(14px, 7vw, 120px); }
  /* the page is a column: air at the top for the controls, the loom, then the floor with the cones */
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 68px var(--padx) 0; box-sizing: border-box; }
  .wrap { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .hint { position: fixed; left: 50%; top: 25px; transform: translateX(-50%); margin: 0; color: var(--dim); font-size: 12px; letter-spacing: .04em;
      pointer-events: none; white-space: nowrap; }

  /* ---- the warping frame: cloth above, then painted frame bars with the warp gathered into bands between them ---- */
  .panel { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
  .reed, .bar { background: var(--frame); border-bottom: 2px solid var(--frame-dark); box-sizing: border-box; pointer-events: none; }
  .reed { height: 10px; position: relative; z-index: 4; margin: 0 -10px; border-radius: 2px; }   /* bars overhang the warp a little, like a frame */
  .bar { height: 8px; margin: 0 -10px; border-radius: 2px; }
  /* the warp itself is drawn on the canvas as real threads; these are the hit areas over it */
  .beam-wrap { position: relative; overflow: hidden; }
  .panel { overflow: visible; }
  .beam { position: relative; display: flex; height: clamp(120px, 24vh, 210px); touch-action: none; }
  .stripe { position: relative; height: 100%; cursor: pointer; flex: none; box-sizing: border-box; }
  .stripe:hover { background: rgba(42,36,32,.06); }
  .stripe.sel { z-index: 2; box-shadow: inset 0 0 0 2px var(--frame); background: rgba(110,59,44,.08); }
  .stripe .n { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); padding: 1px 6px; border-radius: 2px;
      background: var(--frame); color: #fff; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums;
      pointer-events: none; opacity: 0; white-space: nowrap; }
  .stripe.sel .n { opacity: 1; z-index: 3; }
  .handle { position: absolute; top: 0; bottom: 0; right: -5px; width: 10px; cursor: ew-resize; z-index: 3; touch-action: none; }
  .handle::after { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--frame); border-radius: 1px; opacity: 0; }
  .stripe.sel .handle::after, .stripe:hover .handle::after { opacity: 1; }

  /* ---- the floor: yarn cones and the few controls ---- */
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 20px 0 30px; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .label b { color: var(--ink); font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #presets { display: flex; gap: 6px; align-items: center; }
  .rack { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; }
  .cone { background: none; border: 0; padding: 0; cursor: pointer; line-height: 0; transition: transform .12s; }
  .cone:hover { transform: translateY(-3px); }
  .cone:focus-visible { outline: 2px solid var(--frame); outline-offset: 2px; border-radius: 4px; }

  /* ---- controls ---- */
  button.b { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px;
      font: inherit; font-size: 12px; cursor: pointer; letter-spacing: .02em; }
  button.b:hover { border-color: rgba(42,36,32,.7); }
  button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.b:disabled { opacity: .35; cursor: default; }
  button.b.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .preset { padding: 4px; border-radius: 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: flex; gap: 0; overflow: hidden; }
  .preset:hover { border-color: rgba(42,36,32,.7); }
  .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .preset span { display: block; width: 6px; height: 18px; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--accent); color: #fff;
      padding: 8px 14px; border-radius: 6px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 8; }
  .toast.show { opacity: 1; }
  .corner { position: fixed; top: 16px; display: flex; align-items: center; gap: 4px; color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .corner.left { left: var(--padx); } .corner.right { right: var(--padx); z-index: 7; border: 0; padding: 0; }
  .corner button { background: transparent; color: var(--ink); border: 0; border-radius: 4px; width: 30px; height: 30px; font: inherit;
      font-size: 16px; cursor: pointer; line-height: 1; }
  .corner button:hover { background: rgba(42,36,32,.08); }
  .corner button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .corner .z { min-width: 44px; text-align: center; font-size: 11px; letter-spacing: .06em; color: var(--dim); font-variant-numeric: tabular-nums; }
  .corner .wrapme { width: auto; padding: 0 14px; font-size: 12px; letter-spacing: .04em; text-transform: lowercase; background: var(--accent); color: #fff; font-weight: 600; }
  .corner .wrapme:hover { background: #854a38; }
  /* while wrapped: the loom stays on screen under a half-transparent veil, and the card is drawn on a canvas above it */
  .veil { position: fixed; inset: 0; background: rgba(244,241,236,.75); display: none; z-index: 4; }
  .top { position: fixed; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 5; }
  body.wrapped .veil, body.wrapped .top { display: block; }
  body.wrapped .panel, body.wrapped .row, body.wrapped .hint, body.wrapped .corner.left { pointer-events: none; }
  .card { position: fixed; box-sizing: border-box; padding: 14px 22px 18px; display: flex; flex-direction: column; gap: 6px; color: #2a2420;
      opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 6; }
  .card.show { opacity: 1; pointer-events: auto; }
  .card h2 { margin: 0; font: italic 500 22px/1.2 var(--serif); text-wrap: balance; }
  .card .sub { font-size: 12px; color: #6d675a; font-variant-numeric: tabular-nums; }
  .card .sett-strip { display: flex; height: 14px; border-radius: 3px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(42,36,32,.4); }
  .card .sett-strip i { display: block; min-width: 1px; }
  .card .actions { display: flex; gap: 8px; margin-top: 8px; }
  .card .b { color: #2a2420; border-color: rgba(42,36,32,.35); }
  .card .b:hover { border-color: rgba(42,36,32,.7); }
  .card .b.primary { color: #fff; border-color: transparent; }
  @media (max-width: 720px) { .hint { top: 58px; white-space: nowrap; font-size: 11px; } }
  @media (max-width: 520px) { .row { padding: 14px 0 18px; gap: 10px; } .beam { height: 110px; } .stage { padding-top: 96px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap">
    <canvas id="c"></canvas>
    <section class="panel" aria-label="Sett editor">
      <div class="reed" id="reed"></div>
      <div class="beam-wrap"><div class="beam" id="beam" role="listbox" aria-label="Warp stripes, one repeat after another at the cloth's scale"></div></div>
      <div class="bar"></div>
    </section>
  </div>
  <div class="row">
    <span class="label"><b id="count"></b> threads · <b id="stripes"></b> stripes</span>
    <div class="rack" id="rack" aria-label="Yarn cones"></div>
    <span class="spacer"></span>
    <span class="label" id="presets"></span>
    <button class="b" id="add" title="Add a stripe after the selected one">+ stripe</button>
    <button class="b" id="remove" title="Remove the selected stripe">remove</button>
    <button class="b primary" id="share">Share link</button>
  </div>
</div>
<p class="hint">hover to part the threads · click to pluck</p>
<div class="corner left" aria-label="Zoom">
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <span class="z" id="zval">100%</span>
  <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
</div>
<div class="corner right"><button class="wrapme" id="wrapme">wrap me</button></div>
<div class="card" id="card" aria-live="polite">
  <h2>Custom Madras Weave Scarf</h2>
  <div class="sett-strip" id="card-sett"></div>
  <div class="actions">
    <button class="b primary" id="card-share">Share</button>
    <button class="b" id="card-save">Save image</button>
  </div>
</div>

<div class="toast" id="toast">Link copied</div>
<div class="veil"></div>
<canvas class="top" id="top"></canvas>

<script>
(() => {
  // ---------- fabric geometry ----------
  let W = 0, H = 0;                  // simulated fabric size, CSS px (viewport / zoom, set in build)
  const ZOOMS = [0.6, 0.8, 1, 1.5, 2, 3, 4];
  let zoom = 1;                      // screen px per fabric px
  const PITCH = 2;                   // distance between neighbouring threads, so 1 thread = 2 px
  const SEG = 10;                    // physics node spacing along each thread

  // ---------- physics ----------
  const K = 40;        // spring back to rest
  const T = 800;       // tension between neighbouring nodes
  const DAMP = 0.992;  // velocity kept per sub-step
  const R = 46;        // cursor influence radius
  const PUSH = 380;    // static "finger parting the threads" force
  const DRAG = 0.45;   // fraction of cursor velocity dragged into the threads
  const WIND = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 10; // idle breeze
  const DMAX = 16;     // max sideways displacement

  // ---------- the sett: colour + thread count, used for warp and weft alike ----------
  const SKEINS = ['#e84a3e', '#ee7c4c', '#f0a23c', '#e9c93c', '#7fa146', '#3f9a53', '#2f6cc0', '#2b3a67',
                  '#adc4d8', '#e8447c', '#e57f8e', '#8a5a3c', '#3b3f3a', '#d6d2c0', '#f2efe6'];
  const PRESETS = {
    chennai: [['#d3cdb9', 7], ['#e84a3e', 8], ['#a83a2e', 2], ['#e84a3e', 6], ['#d6b23a', 13], ['#ec6b4a', 11], ['#d987a0', 9],
              ['#adc4d8', 10], ['#4aa458', 9], ['#cdd3c3', 8], ['#2f6cc0', 18], ['#ea7d88', 7], ['#ee7c4c', 13], ['#3f9a53', 15],
              ['#c9cdc3', 15], ['#f08a5a', 10], ['#3b3f3a', 12], ['#e8447c', 18], ['#ef7d57', 15], ['#bbc9d6', 15], ['#5f6c3a', 12],
              ['#e9c93c', 22], ['#cacdc5', 15], ['#f0a23c', 20], ['#e94c3d', 20], ['#7fa146', 21], ['#b9c0b8', 12]],
    indigo:  [['#f2efe6', 30], ['#2b3a67', 4], ['#f2efe6', 4], ['#2b3a67', 26], ['#adc4d8', 6], ['#2b3a67', 10]],
    bleeding:[['#e84a3e', 24], ['#e9c93c', 5], ['#2b3a67', 16], ['#f2efe6', 4], ['#3f9a53', 12], ['#e84a3e', 6]],
  };
  let sett = [];         // [{c: '#hex', n: threads}]
  let selected = 0, selRep = 0;   // which stripe is selected, and which repeat of it was clicked

  const encode = () => sett.map(s => s.c.slice(1) + '.' + s.n).join(',');
  const decode = str => {
    const out = [];
    for (const part of str.split(',')) {
      const m = /^([0-9a-f]{6})\.(\d{1,3})$/i.exec(part);
      if (m) out.push({ c: '#' + m[1].toLowerCase(), n: Math.max(1, +m[2]) });
    }
    return out.length ? out : null;
  };
  const fromPreset = name => PRESETS[name].map(([c, n]) => ({ c, n }));
  const fromHash = () => { const m = /[#&]s=([^&]+)/.exec(location.hash); return m ? decode(decodeURIComponent(m[1])) : null; };
  sett = fromHash() || fromPreset('chennai');

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  let seed = 1;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  // every thread is dyed a little differently: lightness wobble + a touch of grey
  function linen(c, r1, r2) {
    const f = 1 + (r1 - 0.5) * 0.24;
    const g = (c[0] + c[1] + c[2]) / 3, s = r2 * 0.12;
    return c.map(v => Math.max(0, Math.min(255, (v * (1 - s) + g * s) * f)));
  }
  const period = () => sett.reduce((a, s) => a + s.n, 0) * PITCH;
  function bandAt(pos) {
    let a = 0;
    for (const s of sett) { a += s.n * PITCH; if (pos < a) return s.c; }
    return sett[sett.length - 1].c;
  }

  // ---------- threads (rebuilt whenever the viewport changes) ----------
  let warps = [], wefts = [], grain;
  let fellY = Infinity, clothH = 0;   // screen y where the bare warp begins, and the height of woven cloth above the reed
  function build() {
    const vw = cv.clientWidth || window.innerWidth, vh = cv.clientHeight || window.innerHeight;   // the canvas's own laid-out size
    W = Math.max(1, Math.round(vw / zoom)); H = Math.max(1, Math.round(vh / zoom));
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    seed = 20240906;
    const NPW = Math.floor(H / SEG) + 2, NPF = Math.floor(W / SEG) + 2;
    warps = []; wefts = [];
    for (let i = 0, x = PITCH / 2; x < W; i++, x += PITCH) {
      warps.push({
        pos: x, r1: rnd(), r2: rnd(), color: '',
        width: PITCH * (1.05 + rnd() * 0.25),
        d: new Float32Array(NPW), v: new Float32Array(NPW), n: NPW,
        dash: (i % 2) * PITCH, stiff: 1,
      });
    }
    for (let y = PITCH / 2; y < H; y += PITCH) {
      const stiff = new Float32Array(NPF);
      stiff.fill(1);
      wefts.push({
        pos: y, r1: rnd(), r2: rnd(), color: '',
        width: PITCH * (1.05 + rnd() * 0.25),
        d: new Float32Array(NPF), v: new Float32Array(NPF), n: NPF, stiff,
      });
    }
    dye();

    // ---------- static overlay: linen grain ----------
    grain = document.createElement('canvas');
    grain.width = W * dpr; grain.height = H * dpr;
    {
      const g = grain.getContext('2d');
      const img = g.createImageData(grain.width, grain.height), p = img.data;
      for (let i = 0; i < p.length; i += 4) { const v = 128 + (rnd() - 0.5) * 150; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
      g.putImageData(img, 0, 0);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.lineWidth = 1.2;
      for (let i = 0, n = W * H / 380; i < n; i++) { // slubs: short lighter / darker fibres
        const x = rnd() * W, y = rnd() * H, l = 6 + rnd() * 40, vert = rnd() < 0.4;
        g.strokeStyle = rnd() < 0.5 ? 'rgba(235,235,235,.55)' : 'rgba(40,40,40,.4)';
        g.beginPath(); g.moveTo(x, y); vert ? g.lineTo(x, y + l) : g.lineTo(x + l, y); g.stroke();
      }
    }
  }
  // recolour every thread from the sett without disturbing the physics
  function dye() {
    const P = period();
    for (const t of warps) {
      t.color = rgb(linen(hex(bandAt(t.pos % P)), t.r1, t.r2));
      const x = t.pos % P; let a = 0;
      for (const st of sett) { const b = a + st.n * PITCH; if (x < b || st === sett[sett.length - 1]) { t.cx = t.pos - x + (a + b) / 2; break; } a = b; }
    }
    for (const t of wefts) t.color = rgb(linen(hex(bandAt(t.pos % P)), t.r1, t.r2));
  }
  build();
  let resizeTimer = 0;
  let lastBox = '';
  new ResizeObserver(() => {
    const box = cv.clientWidth + 'x' + cv.clientHeight; if (box === lastBox) return; lastBox = box;
    clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (mode === 'wrap') endWrap(); build(); renderBeam(); }, 120);
  }).observe(cv);

  // ---------- pointer on the cloth ----------
  const mouse = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, on: false };
  const toLocal = e => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  window.addEventListener('pointermove', e => {
    const [x, y] = toLocal(e);
    if (!mouse.on) { mouse.px = x; mouse.py = y; }
    mouse.x = x; mouse.y = y; mouse.on = true;
  });
  document.documentElement.addEventListener('pointerleave', () => { mouse.on = false; });
  cv.addEventListener('pointerdown', e => { const [x, y] = toLocal(e); pluck(x, y); });
  function pluck(x, y) {
    const RP = 70, S = 700;
    for (const t of warps) for (let k = 0; k < t.n; k++) {
      const dx = t.pos + t.d[k] - x, dy = k * SEG - y, r = Math.hypot(dx, dy);
      if (r < RP) t.v[k] += (dx / (r + 1e-3)) * S * (1 - r / RP);
    }
    for (const t of wefts) for (let k = 0; k < t.n; k++) {
      const dx = k * SEG - x, dy = t.pos + t.d[k] - y, r = Math.hypot(dx, dy);
      if (r < RP) t.v[k] += (dy / (r + 1e-3)) * S * (1 - r / RP);
    }
  }

  // ---------- simulation ----------
  let time = 0;
  function step(dt) {
    time += dt;
    const gust = WIND * (0.6 + 0.4 * Math.sin(time * 0.37));
    const R2 = R * R, on = mouse.on;
    for (const t of warps) {
      const { d, v, n } = t, x0 = t.pos, ks = K * t.stiff;
      for (let k = 0; k < n; k++) {
        const dl = d[k > 0 ? k - 1 : k], dr = d[k < n - 1 ? k + 1 : k];
        let f = -ks * d[k] + T * (dl + dr - 2 * d[k]) + gust * Math.sin(time * 1.4 + k * 0.18 + x0 * 0.012);
        if (on) {
          const dx = x0 + d[k] - mouse.x, dy = k * SEG - mouse.y, r2 = dx * dx + dy * dy;
          if (r2 < R2) { const r = Math.sqrt(r2) + 1e-3, w = 1 - r / R; f += w * w * ((dx / r) * PUSH + mouse.vx * DRAG); }
        }
        v[k] = (v[k] + f * dt) * DAMP;
      }
      for (let k = 0; k < n; k++) { const nd = d[k] + v[k] * dt; d[k] = nd > DMAX ? DMAX : nd < -DMAX ? -DMAX : nd; }
    }
    for (const t of wefts) {
      const { d, v, n, stiff } = t, y0 = t.pos;
      for (let k = 0; k < n; k++) {
        const dl = d[k > 0 ? k - 1 : k], dr = d[k < n - 1 ? k + 1 : k];
        let f = -K * stiff[k] * d[k] + T * (dl + dr - 2 * d[k]) + gust * Math.sin(time * 1.1 + k * 0.15 + y0 * 0.01);
        if (on) {
          const dx = k * SEG - mouse.x, dy = y0 + d[k] - mouse.y, r2 = dx * dx + dy * dy;
          if (r2 < R2) { const r = Math.sqrt(r2) + 1e-3, w = 1 - r / R; f += w * w * ((dy / r) * PUSH + mouse.vy * DRAG); }
        }
        v[k] = (v[k] + f * dt) * DAMP;
      }
      for (let k = 0; k < n; k++) { const nd = d[k] + v[k] * dt; d[k] = nd > DMAX ? DMAX : nd < -DMAX ? -DMAX : nd; }
    }
  }

  // ---------- render: plain weave = continuous weft under dashed warp ----------
  function draw() {
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#d9d4c4'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.setLineDash([]);
    for (const t of wefts) {
      ctx.strokeStyle = t.color; ctx.lineWidth = t.width;
      ctx.beginPath(); ctx.moveTo(0, t.pos + t.d[0]);
      for (let k = 1; k < t.n; k++) ctx.lineTo(k * SEG, t.pos + t.d[k]);
      ctx.stroke();
    }
    ctx.setLineDash([PITCH, PITCH]); ctx.globalAlpha = 0.72;   // weft shows through the warp
    for (const t of warps) {
      ctx.strokeStyle = t.color; ctx.lineWidth = t.width; ctx.lineDashOffset = t.dash;
      ctx.beginPath(); ctx.moveTo(t.pos + t.d[0], 0);
      for (let k = 1; k < t.n; k++) ctx.lineTo(t.pos + t.d[k], k * SEG);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.22;
    ctx.drawImage(grain, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // below the frame bar nothing is woven: the same warp threads, each stripe gathered into a band as on a warping frame
    const beamEl = document.getElementById('beam'), reedEl = document.getElementById('reed');
    const cr = cv.getBoundingClientRect();
    if (beamEl) { fellY = beamEl.getBoundingClientRect().top; clothH = reedEl.getBoundingClientRect().top - cr.top; }   // measured live: the floor can reflow
    const zy = (fellY - cr.top) * H / (cr.height || 1);   // screen y -> fabric y through the canvas's own box
    if (zy < H) {
      ctx.fillStyle = '#dedad1'; ctx.fillRect(0, zy, W, H - zy);
      ctx.save(); ctx.beginPath(); ctx.rect(0, zy, W, H - zy); ctx.clip();

    sett.splice(selected + 1, 0, { c: s.c, n: s.n }); selected++; changed();
  });
  $('remove').addEventListener('click', () => { if (sett.length > 2) { sett.splice(selected, 1); changed(); } });
  $('share').addEventListener('click', async () => {
    const url = location.origin + location.pathname + '#s=' + encode();
    history.replaceState(null, '', '#s=' + encode());
    try { await navigator.clipboard.writeText(url); toast.textContent = 'Link copied'; }
    catch { toast.textContent = 'Copy the address bar to share'; }
    toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1600);
  });
  window.addEventListener('hashchange', () => { const s = fromHash(); if (s) { sett = s; selected = 0; changed(); } });
  renderBeam();
  // #wrap=<ms> opens the page already <ms> into the wrap, for screenshots and testing
  { const m = /[#&]wrap=(\d+)/.exec(location.hash);
    if (m) setTimeout(() => { startWrap(); wrap.t0 = performance.now() - +m[1]; }, 700); }
})();
</script>
</body>
