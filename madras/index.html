<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madras Weave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  :root {
    --ink: #f3e9d6; --dim: #d3bd98; --accent: #e7c068; --paper: #f3ead8; --paper-ink: #3b2a1a;
    --wood: linear-gradient(90deg, rgba(0,0,0,.22), transparent 6%, transparent 94%, rgba(0,0,0,.22)),
            repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 5px, rgba(0,0,0,.04) 5px 6px, transparent 6px 13px),
            linear-gradient(180deg, #8f5c33 0%, #77492a 55%, #613820 100%);
    --wood-edge: #3a2112;
    --brass: linear-gradient(180deg, #efd28a, #cfa64a 55%, #b88c33);
    --panel: rgba(26, 22, 18, .86);
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  }
  html, body { margin: 0; height: 100%; background: #d9d4c4; color: var(--ink); }
  body { overflow: hidden; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
  .wrap { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); margin: 0; padding: 5px 12px; border-radius: 3px;
      background: var(--paper); color: var(--paper-ink); font-size: 12px; letter-spacing: .04em; pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.25); }

  /* ---- the loom frame: a wooden panel with brass pegs at the corners ---- */
  .panel { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(780px, calc(100vw - 24px)); box-sizing: border-box;
      background:
        radial-gradient(circle at 11px 11px, #efd28a 0 2.5px, #8a6a2a 3px, transparent 4.5px) left top / 24px 24px no-repeat,
        radial-gradient(circle at 13px 11px, #efd28a 0 2.5px, #8a6a2a 3px, transparent 4.5px) right top / 24px 24px no-repeat,
        radial-gradient(circle at 11px 13px, #efd28a 0 2.5px, #8a6a2a 3px, transparent 4.5px) left bottom / 24px 24px no-repeat,
        radial-gradient(circle at 13px 13px, #efd28a 0 2.5px, #8a6a2a 3px, transparent 4.5px) right bottom / 24px 24px no-repeat,
        var(--wood);
      border: 1px solid var(--wood-edge); border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(255,225,180,.28), inset 0 -2px 0 rgba(0,0,0,.35), 0 18px 40px -12px rgba(0,0,0,.7);
      padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { font: italic 500 15px/1.2 var(--serif); color: var(--dim); letter-spacing: .01em; }
  .label b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #presets { display: flex; gap: 8px; align-items: center; }

  /* ---- the warp beam: a turned wooden roller with the sett wound on it ---- */
  .cradle { display: flex; align-items: center; gap: 0; }
  .cap { flex: none; width: 18px; height: 60px; border-radius: 5px; background: var(--wood); border: 1px solid var(--wood-edge);
      box-shadow: inset 0 1px 0 rgba(255,225,180,.25); position: relative; }
  .cap::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px;
      background: radial-gradient(circle at 50% 40%, #2a1608, #4a2a14); }
  .beam-wrap { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 6px 0 22px; scrollbar-width: thin; scrollbar-color: #4a2a14 transparent; }
  .beam { position: relative; display: flex; height: 48px; min-width: max-content; touch-action: none; border-radius: 3px; }
  .beam::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
      background:
        repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),          /* the wound thread */
        linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.08) 28%, rgba(0,0,0,0) 45%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.5)); /* roller shading */
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
  .stripe { position: relative; height: 100%; min-width: 8px; cursor: pointer; flex: none; box-sizing: border-box; }
  .stripe.sel { z-index: 2; box-shadow: 0 0 0 2px #2a1608, 0 0 0 4px var(--accent); }
  .stripe .n { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); padding: 1px 6px; border-radius: 2px;
      background: var(--paper); color: var(--paper-ink); font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums;
      pointer-events: none; opacity: 0; box-shadow: 0 1px 2px rgba(0,0,0,.4); white-space: nowrap; }
  .stripe .n::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 6px; background: rgba(243,234,216,.8); }
  .stripe.sel .n { opacity: 1; z-index: 3; }
  .handle { position: absolute; top: -4px; bottom: -4px; right: -6px; width: 12px; cursor: ew-resize; z-index: 3; touch-action: none; }
  .handle::after { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: rgba(255,255,255,.7); border-radius: 1px; opacity: 0; }
  .stripe.sel .handle::after, .stripe:hover .handle::after { opacity: 1; }

  /* ---- the drying rod: dyed hanks hanging in a row ---- */
  .rack { position: relative; display: flex; gap: 7px; flex-wrap: wrap; padding-top: 12px; }
  .rack::before { content: ""; position: absolute; left: -6px; right: -6px; top: 3px; height: 5px; border-radius: 3px;
      background: linear-gradient(180deg, #c9a06a, #8a5a34 60%, #4a2a14); box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .skein { position: relative; width: 22px; height: 34px; border-radius: 11px; border: 0; cursor: pointer; padding: 0;
      background: repeating-linear-gradient(-58deg, rgba(255,255,255,.22) 0 2px, rgba(0,0,0,.10) 2px 4px, rgba(0,0,0,0) 4px 5px), var(--c);
      box-shadow: inset 2px 0 3px rgba(255,255,255,.25), inset -3px -2px 5px rgba(0,0,0,.35), 0 2px 3px rgba(0,0,0,.4);
      transition: transform .12s; transform-origin: 50% 0; }
  .skein::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 9px; margin-left: -1px; background: rgba(243,234,216,.7); }
  .skein:hover { transform: rotate(-6deg) scale(1.06); }
  .skein:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- paper tags and a brass plate for the controls ---- */
  button.b { position: relative; background: var(--paper); color: var(--paper-ink); border: 1px solid #c9b78f; border-radius: 3px; padding: 6px 11px 6px 18px;
      font: inherit; font-size: 12px; cursor: pointer; letter-spacing: .02em; box-shadow: 0 2px 3px rgba(0,0,0,.35); }
  button.b::before { content: ""; position: absolute; left: 7px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%;
      background: #8a6a2a; box-shadow: inset 0 0 0 1.5px #f3ead8; }
  button.b:hover { background: #fbf4e4; }
  button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.b:disabled { opacity: .4; cursor: default; }
  button.b.primary { background: var(--brass); color: #2a1e08; border-color: #8a6a2a; font-weight: 600; padding-left: 11px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 3px rgba(0,0,0,.4); text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  button.b.primary::before { display: none; }
  button.b.primary:hover { background: linear-gradient(180deg, #f6dc98, #d8b058 55%, #c19638); }
  .preset { position: relative; padding: 3px; border-radius: 2px; border: 1px solid rgba(0,0,0,.35); background: var(--paper); cursor: pointer; display: flex; gap: 0;
      box-shadow: 0 2px 3px rgba(0,0,0,.4); transform: rotate(-2deg); }
  .preset:nth-child(2) { transform: rotate(1.5deg); } .preset:nth-child(3) { transform: rotate(-1deg); }
  .preset::before { content: ""; position: absolute; left: 50%; top: -4px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff8a7a, #b0261a); box-shadow: 0 1px 1px rgba(0,0,0,.5); }
  .preset:hover { transform: rotate(0) scale(1.06); }
  .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .preset span { display: block; width: 6px; height: 18px; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--brass); color: #2a1e08; border: 1px solid #8a6a2a;
      padding: 8px 14px; border-radius: 3px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .corner { position: fixed; top: 12px; display: flex; align-items: center; gap: 4px; background: var(--wood); color: var(--ink);
      border: 1px solid var(--wood-edge); border-radius: 4px; padding: 3px; box-shadow: inset 0 1px 0 rgba(255,225,180,.25), 0 4px 10px rgba(0,0,0,.35); }
  .corner.left { left: 12px; } .corner.right { right: 12px; }
  .corner button { background: transparent; color: var(--ink); border: 0; border-radius: 3px; width: 30px; height: 30px; font: inherit;
      font-size: 16px; cursor: pointer; line-height: 1; }
  .corner button:hover { background: rgba(255,255,255,.12); }
  .corner button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .corner .z { min-width: 44px; text-align: center; font-size: 11px; letter-spacing: .06em; color: var(--dim); font-variant-numeric: tabular-nums; }
  .corner .wrapme { width: auto; padding: 0 14px; font-size: 12px; letter-spacing: .04em; text-transform: lowercase; background: var(--brass); color: #2a1e08;
      font-weight: 600; border: 1px solid #8a6a2a; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .corner .wrapme:hover { background: linear-gradient(180deg, #f6dc98, #d8b058 55%, #c19638); }
  body.wrapped .panel, body.wrapped .hint, body.wrapped .corner.left { display: none; }
  .card { position: fixed; box-sizing: border-box; padding: 16px 22px 18px; display: flex; flex-direction: column; gap: 6px; color: #2a2420;
      opacity: 0; transition: opacity .35s; pointer-events: none; }
  .card.show { opacity: 1; pointer-events: auto; }
  .card .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #8a8272; }
  .card h2 { margin: 0; font: italic 500 22px/1.2 var(--serif); text-wrap: balance; }
  .card .sub { font-size: 12px; color: #6d675a; font-variant-numeric: tabular-nums; }
  .card .sett-strip { display: flex; height: 14px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .card .sett-strip i { display: block; min-width: 1px; }
  .card .actions { display: flex; gap: 8px; margin-top: auto; }
  @media (max-width: 720px) { .hint { top: 58px; white-space: nowrap; font-size: 11px; } }
  @media (max-width: 520px) { .panel { padding: 10px 12px 12px; } .stripe .n { display: none; } .cap { width: 12px; } }
</style>
</head>
<body>
<div class="wrap"><canvas id="c"></canvas></div>
<p class="hint">hover to part the threads · click to pluck</p>
<div class="corner left" aria-label="Zoom">
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <span class="z" id="zval">100%</span>
  <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
</div>
<div class="corner right"><button class="wrapme" id="wrapme">wrap me</button></div>
<div class="card" id="card" aria-live="polite">
  <div class="eyebrow">Madras · Scarf</div>
  <h2>Woven thread by thread</h2>
  <div class="sub" id="card-sub"></div>
  <div class="sett-strip" id="card-sett"></div>
  <div class="actions">
    <button class="b primary" id="card-share">Share</button>
    <button class="b" id="card-save">Save image</button>
  </div>
</div>

<section class="panel" aria-label="Sett editor">
  <div class="row">
    <span class="label">Warp beam · a sett of <b id="count"></b> threads in <b id="stripes"></b> stripes</span>
    <span class="spacer"></span>
    <span class="label" id="presets"></span>
  </div>
  <div class="cradle"><div class="cap"></div><div class="beam-wrap"><div class="beam" id="beam" role="listbox" aria-label="Warp stripes"></div></div><div class="cap"></div></div>
  <div class="row">
    <div class="rack" id="rack" aria-label="Dyed hanks"></div>
    <span class="spacer"></span>
    <button class="b" id="add" title="Add a stripe after the selected one">+ stripe</button>
    <button class="b" id="remove" title="Remove the selected stripe">remove</button>
    <button class="b primary" id="share">Share link</button>
  </div>
</section>
<div class="toast" id="toast">Link copied</div>

<script>
(() => {
  // ---------- fabric geometry ----------
  let W = 0, H = 0;                  // simulated fabric size, CSS px (viewport / zoom, set in build)
  const ZOOMS = [0.6, 0.8, 1, 1.5, 2, 3, 4];
  let zoom = 1;                      // screen px per fabric px
  const PITCH = 2;                   // distance between neighbouring threads, so 1 thread = 2 px
  const SEG = 10;                    // physics node spacing along each thread
  const SEAM0 = 105, SEAM_EVERY = 110;     // stitched pleat lines repeat across the width

  // ---------- physics ----------
  const K = 40;        // spring back to rest
  const T = 800;       // tension between neighbouring nodes
  const DAMP = 0.992;  // velocity kept per sub-step
  const R = 46;        // cursor influence radius
  const PUSH = 380;    // static "finger parting the threads" force
  const DRAG = 0.45;   // fraction of cursor velocity dragged into the threads
  const WIND = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 10; // idle breeze
  const DMAX = 16;     // max sideways displacement

  // ---------- the sett: colour + thread count, used for warp and weft alike ----------
  const SKEINS = ['#e84a3e', '#ee7c4c', '#f0a23c', '#e9c93c', '#7fa146', '#3f9a53', '#2f6cc0', '#2b3a67',
                  '#adc4d8', '#e8447c', '#e57f8e', '#8a5a3c', '#3b3f3a', '#d6d2c0', '#f2efe6'];
  const PRESETS = {
    chennai: [['#d3cdb9', 7], ['#e84a3e', 8], ['#a83a2e', 2], ['#e84a3e', 6], ['#d6b23a', 13], ['#ec6b4a', 11], ['#d987a0', 9],
              ['#adc4d8', 10], ['#4aa458', 9], ['#cdd3c3', 8], ['#2f6cc0', 18], ['#ea7d88', 7], ['#ee7c4c', 13], ['#3f9a53', 15],
              ['#c9cdc3', 15], ['#f08a5a', 10], ['#3b3f3a', 12], ['#e8447c', 18], ['#ef7d57', 15], ['#bbc9d6', 15], ['#5f6c3a', 12],
              ['#e9c93c', 22], ['#cacdc5', 15], ['#f0a23c', 20], ['#e94c3d', 20], ['#7fa146', 21], ['#b9c0b8', 12]],
    indigo:  [['#f2efe6', 30], ['#2b3a67', 4], ['#f2efe6', 4], ['#2b3a67', 26], ['#adc4d8', 6], ['#2b3a67', 10]],
    bleeding:[['#e84a3e', 24], ['#e9c93c', 5], ['#2b3a67', 16], ['#f2efe6', 4], ['#3f9a53', 12], ['#e84a3e', 6]],
  };
  let sett = [];         // [{c: '#hex', n: threads}]
  let selected = 0;

  const encode = () => sett.map(s => s.c.slice(1) + '.' + s.n).join(',');
  const decode = str => {
    const out = [];
    for (const part of str.split(',')) {
      const m = /^([0-9a-f]{6})\.(\d{1,3})$/i.exec(part);
      if (m) out.push({ c: '#' + m[1].toLowerCase(), n: Math.max(1, +m[2]) });
    }
    return out.length ? out : null;
  };
  const fromPreset = name => PRESETS[name].map(([c, n]) => ({ c, n }));
  const fromHash = () => { const m = /[#&]s=([^&]+)/.exec(location.hash); return m ? decode(decodeURIComponent(m[1])) : null; };
  sett = fromHash() || fromPreset('chennai');

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  let seed = 1;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  // every thread is dyed a little differently: lightness wobble + a touch of grey
  function linen(c, r1, r2) {
    const f = 1 + (r1 - 0.5) * 0.24;
    const g = (c[0] + c[1] + c[2]) / 3, s = r2 * 0.12;
    return c.map(v => Math.max(0, Math.min(255, (v * (1 - s) + g * s) * f)));
  }
  const period = () => sett.reduce((a, s) => a + s.n, 0) * PITCH;
  function bandAt(pos) {
    let a = 0;
    for (const s of sett) { a += s.n * PITCH; if (pos < a) return s.c; }
    return sett[sett.length - 1].c;
  }
  const seamsIn = w => { const out = []; for (let x = SEAM0; x < w; x += SEAM_EVERY) out.push(x); return out; };
  const nearSeam = x => { const m = ((x - SEAM0) % SEAM_EVERY + SEAM_EVERY) % SEAM_EVERY; return m < 7 || m > SEAM_EVERY - 7; };

  // ---------- threads (rebuilt whenever the viewport changes) ----------
  let warps = [], wefts = [], grain, seams;
  function build() {
    W = Math.max(1, Math.round(window.innerWidth / zoom)); H = Math.max(1, Math.round(window.innerHeight / zoom));
    cv.width = Math.round(window.innerWidth * dpr); cv.height = Math.round(window.innerHeight * dpr);
    seed = 20240906;
    const NPW = Math.floor(H / SEG) + 2, NPF = Math.floor(W / SEG) + 2;
    warps = []; wefts = [];
    for (let i = 0, x = PITCH / 2; x < W; i++, x += PITCH) {
      warps.push({
        pos: x, r1: rnd(), r2: rnd(), color: '',
        width: PITCH * (1.05 + rnd() * 0.25),
        d: new Float32Array(NPW), v: new Float32Array(NPW), n: NPW,
        dash: (i % 2) * PITCH, stiff: nearSeam(x) ? 6 : 1,
      });
    }
    for (let y = PITCH / 2; y < H; y += PITCH) {
      const stiff = new Float32Array(NPF);
      for (let k = 0; k < NPF; k++) stiff[k] = nearSeam(k * SEG) ? 6 : 1;
      wefts.push({
        pos: y, r1: rnd(), r2: rnd(), color: '',
        width: PITCH * (1.05 + rnd() * 0.25),
        d: new Float32Array(NPF), v: new Float32Array(NPF), n: NPF, stiff,
      });
    }
    dye();

    // ---------- static overlays: linen grain + pleat seams ----------
    grain = document.createElement('canvas');
    grain.width = W * dpr; grain.height = H * dpr;
    {
      const g = grain.getContext('2d');
      const img = g.createImageData(grain.width, grain.height), p = img.data;
      for (let i = 0; i < p.length; i += 4) { const v = 128 + (rnd() - 0.5) * 150; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
      g.putImageData(img, 0, 0);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.lineWidth = 1.2;
      for (let i = 0, n = W * H / 380; i < n; i++) { // slubs: short lighter / darker fibres
        const x = rnd() * W, y = rnd() * H, l = 6 + rnd() * 40, vert = rnd() < 0.4;
        g.strokeStyle = rnd() < 0.5 ? 'rgba(235,235,235,.55)' : 'rgba(40,40,40,.4)';
        g.beginPath(); g.moveTo(x, y); vert ? g.lineTo(x, y + l) : g.lineTo(x + l, y); g.stroke();
      }
    }
    seams = document.createElement('canvas');
    seams.width = W * dpr; seams.height = H * dpr;
    {
      const g = seams.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (const s of seamsIn(W)) {
        let gr = g.createLinearGradient(s - 18, 0, s, 0);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.16)');
        g.fillStyle = gr; g.fillRect(s - 18, 0, 18, H);
        g.fillStyle = 'rgba(70,45,35,.38)'; g.fillRect(s - 0.5, 0, 1.2, H);
        gr = g.createLinearGradient(s + 1, 0, s + 9, 0);
        gr.addColorStop(0, 'rgba(255,255,255,.10)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(s + 1, 0, 8, H);
      }
    }
  }
  // recolour every thread from the sett without disturbing the physics
  function dye() {
    const P = period();
    for (const t of warps) t.color = rgb(linen(hex(bandAt(t.pos % P)), t.r1, t.r2));
    for (const t of wefts) t.color = rgb(linen(hex(bandAt(t.pos % P)), t.r1, t.r2));
  }
  build();
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(build, 120); });

  // ---------- pointer on the cloth ----------
  const mouse = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, on: false };
  const toLocal = e => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  cv.addEventListener('pointermove', e => {
    const [x, y] = toLocal(e);
    if (!mouse.on) { mouse.px = x; mouse.py = y; }
    mouse.x = x; mouse.y = y; mouse.on = true;
  });
  cv.addEventListener('pointerleave', () => { mouse.on = false; });
  cv.addEventListener('pointerdown', e => { const [x, y] = toLocal(e); pluck(x, y); });
  function pluck(x, y) {
    const RP = 70, S = 700;
    for (const t of warps) for (let k = 0; k < t.n; k++) {
      const dx = t.pos + t.d[k] - x, dy = k * SEG - y, r = Math.hypot(dx, dy);
      if (r < RP) t.v[k] += (dx / (r + 1e-3)) * S * (1 - r / RP);
    }
    for (const t of wefts) for (let k = 0; k < t.n; k++) {
      const dx = k * SEG - x, dy = t.pos + t.d[k] - y, r = Math.hypot(dx, dy);
      if (r < RP) t.v[k] += (dy / (r + 1e-3)) * S * (1 - r / RP);
    }
  }

  // ---------- simulation ----------
  let time = 0;
  function step(dt) {
    time += dt;
    const gust = WIND * (0.6 + 0.4 * Math.sin(time * 0.37));
    const R2 = R * R, on = mouse.on;
    for (const t of warps) {
      const { d, v, n } = t, x0 = t.pos, ks = K * t.stiff;
      for (let k = 0; k < n; k++) {
        const dl = d[k > 0 ? k - 1 : k], dr = d[k < n - 1 ? k + 1 : k];
        let f = -ks * d[k] + T * (dl + dr - 2 * d[k]) + gust * Math.sin(time * 1.4 + k * 0.18 + x0 * 0.012);
        if (on) {
          const dx = x0 + d[k] - mouse.x, dy = k * SEG - mouse.y, r2 = dx * dx + dy * dy;
          if (r2 < R2) { const r = Math.sqrt(r2) + 1e-3, w = 1 - r / R; f += w * w * ((dx / r) * PUSH + mouse.vx * DRAG); }
        }
        v[k] = (v[k] + f * dt) * DAMP;
      }
      for (let k = 0; k < n; k++) { const nd = d[k] + v[k] * dt; d[k] = nd > DMAX ? DMAX : nd < -DMAX ? -DMAX : nd; }
    }
    for (const t of wefts) {
      const { d, v, n, stiff } = t, y0 = t.pos;
      for (let k = 0; k < n; k++) {
        const dl = d[k > 0 ? k - 1 : k], dr = d[k < n - 1 ? k + 1 : k];
        let f = -K * stiff[k] * d[k] + T * (dl + dr - 2 * d[k]) + gust * Math.sin(time * 1.1 + k * 0.15 + y0 * 0.01);
        if (on) {
          const dx = k * SEG - mouse.x, dy = y0 + d[k] - mouse.y, r2 = dx * dx + dy * dy;
          if (r2 < R2) { const r = Math.sqrt(r2) + 1e-3, w = 1 - r / R; f += w * w * ((dy / r) * PUSH + mouse.vy * DRAG); }
        }
        v[k] = (v[k] + f * dt) * DAMP;
      }
      for (let k = 0; k < n; k++) { const nd = d[k] + v[k] * dt; d[k] = nd > DMAX ? DMAX : nd < -DMAX ? -DMAX : nd; }
    }
  }

  // ---------- render: plain weave = continuous weft under dashed warp ----------
  function draw() {
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#d9d4c4'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.setLineDash([]);
    for (const t of wefts) {
      ctx.strokeStyle = t.color; ctx.lineWidth = t.width;
      ctx.beginPath(); ctx.moveTo(0, t.pos + t.d[0]);
      for (let k = 1; k < t.n; k++) ctx.lineTo(k * SEG, t.pos + t.d[k]);
      ctx.stroke();
    }
    ctx.setLineDash([PITCH, PITCH]); ctx.globalAlpha = 0.72;   // weft shows through the warp
    for (const t of warps) {
      ctx.strokeStyle = t.color; ctx.lineWidth = t.width; ctx.lineDashOffset = t.dash;
      ctx.beginPath(); ctx.moveTo(t.pos + t.d[0], 0);
      for (let k = 1; k < t.n; k++) ctx.lineTo(t.pos + t.d[k], k * SEG);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.22;
    ctx.drawImage(grain, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(seams, 0, 0, W, H);
  }

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  let mode = 'loom';
  function frame() {
    if (mouse.on) {
      mouse.vx = clamp((mouse.x - mouse.px) * 60, -1500, 1500);
      mouse.vy = clamp((mouse.y - mouse.py) * 60, -1500, 1500);
      mouse.px = mouse.x; mouse.py = mouse.y;
    } else { mouse.vx = mouse.vy = 0; }
    if (mode === 'loom') { step(1 / 120); step(1 / 120); draw(); }
    else drawWrap();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const $ = id => document.getElementById(id);

  // ---------- zoom ----------
  function setZoom(z) {
    zoom = z; $('zval').textContent = Math.round(z * 100) + '%';
    $('zin').disabled = z >= ZOOMS[ZOOMS.length - 1]; $('zout').disabled = z <= ZOOMS[0];
    build();
  }
  const zoomStep = dir => { const i = clamp(ZOOMS.indexOf(zoom) + dir, 0, ZOOMS.length - 1); if (ZOOMS[i] !== zoom) setZoom(ZOOMS[i]); };
  $('zin').addEventListener('click', () => zoomStep(1));
  $('zout').addEventListener('click', () => zoomStep(-1));
  window.addEventListener('keydown', e => {
    if (e.target.closest('.panel')) return;
    if (e.key === '+' || e.key === '=') zoomStep(1); else if (e.key === '-' || e.key === '_') zoomStep(-1);
  });
  window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomStep(e.deltaY < 0 ? 1 : -1); } }, { passive: false });

  // ---------- wrap me: run the cloth around the screen and fold it onto a card ----------
  let wrap = null;
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  // arc-length lookup along a polyline: at(s) gives point + unit normal
  function polyline(pts) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = cum[cum.length - 1];
    const at = s => {
      s = clamp(s, 0, L); let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
      const f = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
      const x = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, y = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f;
      const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1], d = Math.hypot(dx, dy) || 1;
      return [x, y, -dy / d, dx / d];
    };
    return { at, L, cum };
  }
  // straight legs with rounded corners, like the snake game's turns
  function roundedRoute(ctrl, rad) {
    const pts = [ctrl[0]];
    for (let i = 1; i < ctrl.length - 1; i++) {
      const p = ctrl[i - 1], c = ctrl[i], n = ctrl[i + 1];
      const want = typeof rad === 'function' ? rad(i) : rad;
      const d1 = Math.hypot(c[0] - p[0], c[1] - p[1]), d2 = Math.hypot(n[0] - c[0], n[1] - c[1]), r = Math.min(want, d1 / 2, d2 / 2);
      const a = [c[0] + (p[0] - c[0]) * r / d1, c[1] + (p[1] - c[1]) * r / d1], b = [c[0] + (n[0] - c[0]) * r / d2, c[1] + (n[1] - c[1]) * r / d2];
      for (let k = 0; k <= 10; k++) {
        const t = k / 10, m = 1 - t;
        pts.push([m * m * a[0] + 2 * m * t * c[0] + t * t * b[0], m * m * a[1] + 2 * m * t * c[1] + t * t * b[1]]);
      }
    }
    pts.push(ctrl[ctrl.length - 1]);
    return polyline(pts);
  }
  // textured quad on a 2D canvas: affine map from texture px to screen px, clipped to the quad
  function quad(img, a, b, c, d) {
    const x0 = a.x, y0 = a.y, x1 = b.x, y1 = b.y, x2 = d.x, y2 = d.y;
    const u0 = a.tu, v0 = a.tv, u1 = b.tu, v1 = b.tv, u2 = d.tu, v2 = d.tv;
    const det = u0 * (v2 - v1) - u1 * v2 + u2 * v1 + (u1 - u2) * v0;
    if (Math.abs(det) < 1e-6) return;
    const ma = -(v0 * (x2 - x1) - v1 * x2 + v2 * x1 + (v1 - v2) * x0) / det;
    const mb = (v1 * y2 + v0 * (y1 - y2) - v2 * y1 + (v2 - v1) * y0) / det;
    const mc = (u0 * (x2 - x1) - u1 * x2 + u2 * x1 + (u1 - u2) * x0) / det;
    const md = -(u1 * y2 + u0 * (y1 - y2) - u2 * y1 + (u2 - u1) * y0) / det;
    const me = (u0 * (v2 * x1 - v1 * x2) + v0 * (u1 * x2 - u2 * x1) + (u2 * v1 - u1 * v2) * x0) / det;
    const mf = (u0 * (v2 * y1 - v1 * y2) + v0 * (u1 * y2 - u2 * y1) + (u2 * v1 - u1 * v2) * y0) / det;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
    ctx.clip();
    ctx.transform(ma, mb, mc, md, me, mf);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
    // hairline over the shared edge hides sub-pixel seams between quads
    ctx.strokeStyle = 'rgba(0,0,0,.06)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.stroke();
  }

  function startWrap() {
    const sw = window.innerWidth, sh = window.innerHeight;
    const tex = document.createElement('canvas'); tex.width = cv.width; tex.height = cv.height;
    tex.getContext('2d').drawImage(cv, 0, 0);
    // the card, centred, and the folded scarf that will sit on it
    const cw = Math.min(sw - 32, 380), ch = Math.min(sh - 32, cw * 1.32), cx0 = (sw - cw) / 2, cy0 = (sh - ch) / 2;
    const pad = 20, passes = 4, gap = 1.25, w = (ch * 0.56) / (passes * gap), spacing = w * gap;
    const px0 = cx0 + pad + w / 2, px1 = cx0 + cw - pad - w / 2;
    const zig = [];
    for (let k = 0; k < passes; k++) {
      const y = cy0 + pad + w / 2 + k * spacing;
      zig.push(k % 2 === 0 ? [px1, y] : [px0, y]); zig.push(k % 2 === 0 ? [px0, y] : [px1, y]);
    }
    const mx = sw * 0.07, my = sh * 0.07, inset = w / 2 + 6;
    const route = roundedRoute([
      [sw, sh / 2], [mx, sh / 2],                           // a band across the middle, head at the left edge
      [mx, sh - my - inset],                                // south
      [sw - mx - inset, sh - my - inset],                   // east
      [sw - mx - inset, my + inset],                        // north
      [px1, my + inset],                                    // west along the top
      ...zig,                                               // down onto the card, then fold back and forth
    ], i => i >= 6 ? spacing / 2 : Math.min(sw, sh) * 0.18); // tight, fold-sized turns once on the card
    const lenFinal = roundedRoute(zig, spacing / 2).L - w * 0.7;   // tail ends just inside the first pass
    const cols = 64, rows = 6, verts = [];
    for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) verts.push({ u: i / cols, v: j / rows });
    wrap = { tex, t0: performance.now(), dur: 3000, verts, cols, rows, sw, sh, route, mx, my, w, lenFinal, card: { x: cx0, y: cy0, w: cw, h: ch, pad, swatchH: passes * spacing } };
    mode = 'wrap'; mouse.on = false;
    document.body.classList.add('wrapped');
    $('wrapme').textContent = 'back to the loom';
    const c = $('card');
    c.style.left = cx0 + 'px'; c.style.top = (cy0 + pad + passes * spacing) + 'px'; c.style.width = cw + 'px'; c.style.height = (ch - pad - passes * spacing) + 'px';
    $('card-sub').textContent = `${sett.reduce((a, s) => a + s.n, 0)} threads per repeat · ${sett.length} stripes`;
    $('card-sett').innerHTML = sett.map(s => `<i style="background:${s.c};flex:${s.n}"></i>`).join('');
    c.classList.remove('show');
  }
  function endWrap() {
    wrap = null; mode = 'loom';
    document.body.classList.remove('wrapped');
    $('wrapme').textContent = 'wrap me'; $('card').classList.remove('show');
  }
  $('wrapme').addEventListener('click', () => mode === 'loom' ? startWrap() : endWrap());

  function drawCard(alpha) {
    const { x, y, w, h } = wrap.card;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(40,30,20,.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    ctx.fillStyle = '#f6f2ea'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(70,55,40,.18)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  function drawWrap() {
    const w = wrap, t = Math.min(1, (performance.now() - w.t0) / w.dur);
    const { sw, sh, verts, cols, rows, tex, route, mx, my, lenFinal } = w;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#e6e0d2'; ctx.fillRect(0, 0, sw, sh);
    // t 0 .. ZOOM: zoom out and gather the leading edge into a rope.  ZOOM .. 1: the run, ending folded on the card
    const ZOOM = 0.1, lerp = (a, b, k) => a + (b - a) * k;
    let headS, len, wide, front;
    if (t < ZOOM) {
      const k = ease(t / ZOOM);
      headS = sw - mx * k; len = sw - 2 * mx * k; wide = sh - 2 * my * k; front = 0.22 * k;
    } else {
      const q = (t - ZOOM) / (1 - ZOOM), k = ease(q);
      headS = lerp(sw - mx, route.L, k); wide = sh - 2 * my; front = 0.22 + q / 0.28 * 1.1;
      len = lerp(sw - 2 * mx, lenFinal, ease(clamp(q / 0.5, 0, 1)));
    }
    drawCard(ease(clamp((t - 0.6) / 0.3, 0, 1)));
    const P = [];
    for (const vt of verts) {
      const [x, y, nx, ny] = route.at(headS - vt.u * len);
      const wv = lerp(wide, w.w, ease(clamp((front - vt.u) / 0.2, 0, 1)));
      P.push({ x: x - nx * (vt.v - 0.5) * wv, y: y - ny * (vt.v - 0.5) * wv, tu: vt.u * tex.width, tv: vt.v * tex.height });
    }
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = j * (cols + 1) + i;
      quad(tex, P[k], P[k + 1], P[k + cols + 2], P[k + cols + 1]);
    }
    if (t >= 1) $('card').classList.add('show');
  }

  // ---------- sharing the card ----------
  const shareUrl = () => location.origin + location.pathname + '#s=' + encode();
  const flash = msg => { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1600); };
  $('card-share').addEventListener('click', async () => {
    const url = shareUrl();
    if (navigator.share) { try { await navigator.share({ title: 'My madras scarf', text: 'A madras I wove, thread by thread', url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); flash('Link copied'); } catch { flash('Copy the address bar to share'); }
  });
  $('card-save').addEventListener('click', () => {
    if (!wrap) return;
    const { x, y, w, h } = wrap.card, S = 2;
    const out = document.createElement('canvas'); out.width = w * S; out.height = h * S;
    const g = out.getContext('2d');
    g.drawImage(cv, x * dpr, y * dpr, w * dpr, h * dpr, 0, 0, w * S, h * S);   // card + folded scarf as drawn on screen
    g.setTransform(S, 0, 0, S, 0, 0);
    const top = wrap.card.pad + wrap.card.swatchH + 16, left = 22;
    g.fillStyle = '#8a8272'; g.font = '600 10px system-ui, sans-serif'; g.fillText('MADRAS  ·  SCARF', left, top + 4);
    g.fillStyle = '#2a2420'; g.font = '600 20px system-ui, sans-serif'; g.fillText('Woven thread by thread', left, top + 30);
    g.fillStyle = '#6d675a'; g.font = '12px system-ui, sans-serif'; g.fillText($('card-sub').textContent, left, top + 50);
    const total = sett.reduce((a, s) => a + s.n, 0); let sx = left;
    for (const st of sett) { const bw = (w - 44) * st.n / total; g.fillStyle = st.c; g.fillRect(sx, top + 64, bw + 0.5, 14); sx += bw; }
    g.fillStyle = '#8a8272'; g.font = '10px system-ui, sans-serif'; g.fillText(location.host + location.pathname, left, h - 16);
    const a = document.createElement('a'); a.download = 'madras-scarf.png'; a.href = out.toDataURL('image/png'); a.click();
  });

  // ---------- the beam: sett editor ----------
  const beam = $('beam'), rack = $('rack'), presetsEl = $('presets'), toast = $('toast');
  const PX_PER_THREAD = 1.6, MIN_N = 1, MAX_N = 120, MAX_STRIPES = 40;

  function changed() { dye(); renderBeam(); history.replaceState(null, '', '#s=' + encode()); }

  function renderBeam() {
    selected = clamp(selected, 0, sett.length - 1);
    beam.textContent = '';
    sett.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'stripe' + (i === selected ? ' sel' : '');
      el.style.background = s.c; el.style.width = (s.n * PX_PER_THREAD) + 'px';
      el.setAttribute('role', 'option'); el.setAttribute('aria-selected', i === selected);
      el.setAttribute('aria-label', `stripe ${i + 1}, ${s.n} threads`); el.tabIndex = 0;
      el.innerHTML = `<span class="n">${s.n}</span><div class="handle" title="drag to change thread count"></div>`;
      el.addEventListener('click', e => { if (e.target.classList.contains('handle')) return; selected = i; renderBeam(); });
      el.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' && e.shiftKey) { s.n = Math.min(MAX_N, s.n + 1); changed(); }
        else if (e.key === 'ArrowLeft' && e.shiftKey) { s.n = Math.max(MIN_N, s.n - 1); changed(); }
        else if (e.key === 'ArrowRight') { selected = Math.min(sett.length - 1, i + 1); renderBeam(); focusSel(); }
        else if (e.key === 'ArrowLeft') { selected = Math.max(0, i - 1); renderBeam(); focusSel(); }
        else return;
        e.preventDefault();
      });
      const h = el.querySelector('.handle');
      h.addEventListener('pointerdown', e => {
        e.preventDefault(); e.stopPropagation();
        selected = i; renderBeam();
        const start = e.clientX, n0 = s.n, live = beam.children[i], num = live.querySelector('.n');
        live.setPointerCapture?.(e.pointerId);
        const move = ev => {
          s.n = clamp(Math.round(n0 + (ev.clientX - start) / PX_PER_THREAD), MIN_N, MAX_N);
          live.style.width = (s.n * PX_PER_THREAD) + 'px'; num.textContent = s.n; dye(); updateCounts();
        };
        const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); changed(); };
        window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
      });
      beam.appendChild(el);
    });
    updateCounts();
    $('remove').disabled = sett.length <= 2;
    $('add').disabled = sett.length >= MAX_STRIPES;
  }
  const focusSel = () => beam.children[selected]?.focus();
  function updateCounts() {
    $('count').textContent = sett.reduce((a, s) => a + s.n, 0);
    $('stripes').textContent = sett.length;
  }

  for (const c of SKEINS) {
    const b = document.createElement('button');
    b.className = 'skein'; b.style.setProperty('--c', c); b.title = c; b.setAttribute('aria-label', 'dye selected stripe ' + c);
    b.addEventListener('click', () => { sett[selected].c = c; changed(); });
    rack.appendChild(b);
  }
  for (const name of Object.keys(PRESETS)) {
    const b = document.createElement('button');
    b.className = 'preset'; b.title = name; b.setAttribute('aria-label', 'preset ' + name);
    b.innerHTML = PRESETS[name].slice(0, 8).map(([c]) => `<span style="background:${c}"></span>`).join('');
    b.addEventListener('click', () => { sett = fromPreset(name); selected = 0; changed(); });
    presetsEl.appendChild(b);
  }
  $('add').addEventListener('click', () => {
    const s = sett[selected];
    sett.splice(selected + 1, 0, { c: s.c, n: s.n }); selected++; changed();
  });
  $('remove').addEventListener('click', () => { if (sett.length > 2) { sett.splice(selected, 1); changed(); } });
  $('share').addEventListener('click', async () => {
    const url = location.origin + location.pathname + '#s=' + encode();
    history.replaceState(null, '', '#s=' + encode());
    try { await navigator.clipboard.writeText(url); toast.textContent = 'Link copied'; }
    catch { toast.textContent = 'Copy the address bar to share'; }
    toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1600);
  });
  window.addEventListener('hashchange', () => { const s = fromHash(); if (s) { sett = s; selected = 0; changed(); } });
  renderBeam();
})();
</script>
</body>
</html>
